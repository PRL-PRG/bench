[project]
name = "bench"
version = "0.1.0"
description = "A lightweight Python benchmarking framework"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "cattrs>=26.1.0",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
lint = ["ruff>=0.15.17", "pyright>=1.1.408"]

[project.scripts]
bench = "bench.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
  "E741" # ambiguous-variable-name
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests", "examples"]
strict = ["src"]

[dependency-groups]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]
