[project]
name = "bench-framework"
version = "0.1.0"
description = "A Python benchmarking framework and command-line tool"
maintainers = [
  { name = "Filip Říha", email = "riha.fina@gmail.com" },
  { name = "Filip Křikava", email = "krikava@gmail.com" },
]

readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
dependencies = [
    "cattrs>=26.1.0",
    "rich",
]

[project.urls]
Homepage = "https://github.com/PRL-PRG/bench"

# ----------
# Build
# ----------
[project.scripts]
bench = "bench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

# ----------
# Dev tools
# ----------
[dependency-groups]
test = [
    "pytest",
    "pytest-cov>=7.1.0",
]
lint = ["ruff>=0.15.17", "pyright>=1.1.408"]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

[tool.uv]
default-groups = ["test"]

# ----------
# Test
# ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing:skip-covered", "--junitxml=pytest.xml"]

[tool.coverage.run]
source = ["bench"]
branch = true
relative_files = true
# CLI and example tests spawn `python -m bench`; without this they contribute nothing.
patch = ["subprocess"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ----------
# Lint
# ----------
[tool.ruff]
include = ["src/**.py", "tests/**.py", "examples/**.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # Default
  "E4", "E7", "E9", "F",
  # isort - sorted includes
  "I",
  # pyupgrade - deprecations
  "UP"
]
ignore = [
  "E741" # ambiguous-variable-name
]

# ----------
# Typecheck
# ----------
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests", "examples"]
strict = ["src"]
