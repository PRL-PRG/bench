name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out; defaults to the triggering ref
        type: string
        default: ""

concurrency:
  # When called from another workflow, `github.workflow` is the caller's name,
  # keeping that run from cancelling (or being cancelled by) a push-triggered CI run.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint, typecheck, test
        run: make check

      - name: Test summary
        if: ${{ !cancelled() && hashFiles('pytest.xml') != '' }}
        uses: test-summary/action@v2
        with:
          paths: pytest.xml
          show: fail, skip

      - name: Check format
        run: make check-format
