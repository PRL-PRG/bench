name: CI

on:
  push:
    branches: [main, update-rf]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint, typecheck, test
        run: make check

      - name: Format
        if: ${{ !cancelled() }}
        run: make check-format
