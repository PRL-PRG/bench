site_name: bench
repo_url: https://github.com/PRL-PRG/bench

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts: [scripts/gen_ref_pages.py]
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          # `src/bench` lets the namespace subpackages (bench.core, bench.console,
          # bench.model) resolve as top-level names - see scripts/gen_ref_pages.py.
          paths: [src, src/bench]

markdown_extensions:
  - pymdownx.snippets:
      base_path: [.]

nav:
  - Home: index.md
  - API: api/
